<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blog Generator</title>
    <meta name="description" content="Generate SEO-friendly, high-quality blogs.">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Clean, professional color palette */
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --border-hover: #d1d5db;
            --success: #10b981;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --radius-md: 8px;
            --radius-sm: 4px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Top Nav/Actions */
        .top-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* Forms and Inputs */
        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #fff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: var(--bg-color);
        }

        .btn-small {
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
        }

        /* Chips */
        .chips-container {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .chips-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .chip {
            padding: 0.35rem 0.75rem;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* States */
        .loader-wrapper {
            display: none;
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
        }

        .error-card {
            display: none;
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            padding: 1rem;
            color: var(--error);
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        /* Output Section */
        .blog-section {
            display: none;
        }

        .blog-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .blog-section-card {
            margin-bottom: 1.5rem;
        }

        .blog-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .blog-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .blog-section-content {
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .blog-section-content p {
            margin-bottom: 1rem;
        }

        .blog-section-content h3 {
            font-size: 1.1rem;
            margin: 1.5rem 0 0.5rem 0;
        }

        .blog-section-content ul, .blog-section-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-body {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-content-area {
            padding: 1.5rem;
            overflow-y: auto;
        }

        .history-item {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: var(--bg-color);
        }

        /* Toast Component */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #374151;
            color: #fff;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .raw-content {
            display: none;
            background: var(--bg-color);
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .grid-inputs { grid-template-columns: 1fr; }
            .blog-toolbar { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Actions -->
        <div class="top-actions">
            <button class="btn btn-secondary btn-small" id="open-history-btn">
                <i class="fas fa-bookmark"></i> History
            </button>
        </div>

        <!-- Header -->
        <header>
            <h1>Blog Generator Engine</h1>
            <p class="subtitle">Enter your topic and parameters to generate a draft.</p>
        </header>

        <!-- Main Input Card -->
        <div class="card">
            <div class="section-title">
                <i class="fas fa-pen"></i> Document Setup
            </div>

            <div class="input-group">
                <label for="topic-input">Blog Topic</label>
                <input type="text" id="topic-input" placeholder="e.g. 10 Proven Marketing Strategies for 2026" autocomplete="off">
            </div>

            <div class="grid-inputs">
                <div class="input-group">
                    <label for="keyword-input">Target Keyword</label>
                    <input type="text" id="keyword-input" placeholder="e.g. Digital Marketing" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="length-select">Content Length</label>
                    <select id="length-select">
                        <option value="Short">Short (~500 words)</option>
                        <option value="Medium" selected>Medium (~1000 words)</option>
                        <option value="Long">Long (~1500+ words)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="tone-select">Tone of Voice</label>
                    <select id="tone-select">
                        <option value="Professional" selected>Professional</option>
                        <option value="Friendly">Friendly</option>
                        <option value="Academic">Academic</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="instructions-input">Additional Instructions (Optional)</label>
                <input type="text" id="instructions-input" placeholder="e.g. Include statistics, use bullet points..." autocomplete="off">
            </div>

            <button class="btn btn-primary" id="generate-btn" style="width: 100%;">
                Generate Content
            </button>

            <!-- Quick Topic Chips -->
            <div class="chips-container">
                <span class="chips-label">Examples:</span>
                <div class="chip" data-topic="Artificial Intelligence Trends">AI Trends</div>
                <div class="chip" data-topic="Web Development Basics">Web Dev</div>
                <div class="chip" data-topic="Personal Finance Tips">Finance</div>
                <div class="chip" data-topic="Healthy Living Habits">Health</div>
            </div>

            <!-- Loader State -->
            <div class="loader-wrapper" id="loader">
                <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 0.5rem;">Generating document...</p>
            </div>

            <!-- Error Banner -->
            <div class="error-card" id="error-message"></div>
        </div>

        <!-- Blog Output Section -->
        <div class="card blog-section" id="blog-section">
            
            <div class="blog-toolbar">
                <h2 style="font-size: 1.25rem;" id="blog-topic-display">Generated Document</h2>
                <div class="action-group">
                    <button class="btn btn-secondary btn-small" id="toggle-view-btn">
                        <i class="fas fa-code"></i> Raw View
                    </button>
                    <button class="btn btn-secondary btn-small" id="copy-btn">
                        <i class="fas fa-copy"></i> Copy All
                    </button>
                    <button class="btn btn-secondary btn-small" id="download-btn">
                        <i class="fas fa-download"></i> Save .txt
                    </button>
                </div>
            </div>

            <!-- Visual Formatted Sections Display -->
            <div id="blog-formatted-view">
                <!-- Sections will be injected here dynamically by JS -->
                <div class="blog-section-card" id="sec-seo-title">
                    <div class="blog-section-header">
                        <div class="blog-section-title">SEO Title</div>
                        <button class="btn btn-secondary btn-small sec-copy-btn" data-target="seo-title-content"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="blog-section-content" id="seo-title-content"></div>
                </div>

                <div class="blog-section-card" id="sec-meta-desc">
                    <div class="blog-section-header">
                        <div class="blog-section-title">Meta Description</div>
                        <button class="btn btn-secondary btn-small sec-copy-btn" data-target="meta-desc-content"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="blog-section-content" id="meta-desc-content"></div>
                </div>

                <div class="blog-section-card" id="sec-intro">
                    <div class="blog-section-header">
                        <div class="blog-section-title">Introduction</div>
                        <button class="btn btn-secondary btn-small sec-copy-btn" data-target="intro-content"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="blog-section-content" id="intro-content"></div>
                </div>

                <div class="blog-section-card" id="sec-main-content">
                    <div class="blog-section-header">
                        <div class="blog-section-title">Main Content</div>
                        <button class="btn btn-secondary btn-small sec-copy-btn" data-target="main-content-body"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="blog-section-content" id="main-content-body"></div>
                </div>

                <div class="blog-section-card" id="sec-conclusion">
                    <div class="blog-section-header">
                        <div class="blog-section-title">Conclusion</div>
                        <button class="btn btn-secondary btn-small sec-copy-btn" data-target="conclusion-content"><i class="fas fa-copy"></i></button>
                    </div>
                    <div class="blog-section-content" id="conclusion-content"></div>
                </div>
            </div>

            <!-- Raw Content Fallback -->
            <div id="raw-view" class="raw-content"></div>
        </div>
    </div>

    <!-- Saved History Modal -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-body">
            <div class="modal-header">
                <div class="modal-title">Saved Documents</div>
                <button class="close-btn" id="close-history-modal">&times;</button>
            </div>
            <div class="modal-content-area">
                <div id="history-items-container">
                    <p style="color: var(--text-muted); text-align: center;">No history available.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Component -->
    <div class="toast" id="toast">
        <i class="fas fa-check"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const topicInput = document.getElementById('topic-input');
            const keywordInput = document.getElementById('keyword-input');
            const lengthSelect = document.getElementById('length-select');
            const toneSelect = document.getElementById('tone-select');
            const instructionsInput = document.getElementById('instructions-input');
            const generateBtn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            const errorMessage = document.getElementById('error-message');

            const blogSection = document.getElementById('blog-section');
            const blogTopicDisplay = document.getElementById('blog-topic-display');
            const blogFormattedView = document.getElementById('blog-formatted-view');
            const rawView = document.getElementById('raw-view');

            const seoTitleContent = document.getElementById('seo-title-content');
            const metaDescContent = document.getElementById('meta-desc-content');
            const introContent = document.getElementById('intro-content');
            const mainContentBody = document.getElementById('main-content-body');
            const conclusionContent = document.getElementById('conclusion-content');

            const copyBtn = document.getElementById('copy-btn');
            const downloadBtn = document.getElementById('download-btn');
            const toggleViewBtn = document.getElementById('toggle-view-btn');
            
            const openHistoryBtn = document.getElementById('open-history-btn');
            const historyModal = document.getElementById('history-modal');
            const closeHistoryModal = document.getElementById('close-history-modal');
            const historyItemsContainer = document.getElementById('history-items-container');
            
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            let currentBlogText = '';
            let currentTopic = '';
            let isRawView = false;

            function showToast(msg) {
                toastMessage.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    topicInput.value = chip.getAttribute('data-topic');
                });
            });

            [topicInput, keywordInput, instructionsInput].forEach(inputEl => {
                inputEl.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') generateBtn.click();
                });
            });

            generateBtn.addEventListener('click', async () => {
                const topic = topicInput.value.trim();
                
                if (!topic) {
                    showError('Please enter a blog topic.');
                    return;
                }

                clearError();
                showLoading(true);

                try {
                    const bodyParams = new URLSearchParams({
                        topic: topic,
                        keyword: keywordInput.value.trim(),
                        length: lengthSelect.value,
                        tone: toneSelect.value,
                        instructions: instructionsInput.value.trim()
                    });

                    // API Call
                    const response = await fetch('/generate_blog', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: bodyParams.toString()
                    });

                    const data = await response.json();

                    if (!response.ok || data.error) {
                        throw new Error(data.error || 'Failed to generate document.');
                    }

                    currentBlogText = data.blog;
                    currentTopic = topic;

                    blogTopicDisplay.textContent = topic;
                    rawView.textContent = currentBlogText;
                    renderBlogSections(currentBlogText);

                    blogSection.style.display = 'block';
                    saveToHistory(topic, currentBlogText);
                    showToast('Document generated successfully');

                } catch (err) {
                    showError(err.message || 'An unexpected error occurred.');
                } finally {
                    showLoading(false);
                }
            });

            function renderBlogSections(fullText) {
                const sections = parseBlogSections(fullText);
                seoTitleContent.innerHTML = renderMarkdownToHtml(sections.seoTitle || currentTopic);
                metaDescContent.innerHTML = renderMarkdownToHtml(sections.metaDesc);
                introContent.innerHTML = renderMarkdownToHtml(sections.intro);
                mainContentBody.innerHTML = renderMarkdownToHtml(sections.mainContent);
                conclusionContent.innerHTML = renderMarkdownToHtml(sections.conclusion);
            }

            function parseBlogSections(text) {
                const lines = text.split('\n');
                let currentKey = 'mainContent';
                const buffer = { seoTitle: [], metaDesc: [], intro: [], mainContent: [], conclusion: [] };

                lines.forEach(line => {
                    const lower = line.trim().toLowerCase();
                    if (lower.match(/^#+\s*seo title/i) || lower.match(/^#+\s*title/i) && !buffer.seoTitle.length) currentKey = 'seoTitle';
                    else if (lower.match(/^#+\s*meta description/i) || lower.match(/^#+\s*meta/i)) currentKey = 'metaDesc';
                    else if (lower.match(/^#+\s*introduction/i) || lower.match(/^#+\s*intro/i)) currentKey = 'intro';
                    else if (lower.match(/^#+\s*main/i) || lower.match(/^#+\s*body/i)) currentKey = 'mainContent';
                    else if (lower.match(/^#+\s*conclusion/i) || lower.match(/^#+\s*summary/i)) currentKey = 'conclusion';
                    else if (currentKey) buffer[currentKey].push(line);
                });

                return {
                    seoTitle: buffer.seoTitle.join('\n').trim(),
                    metaDesc: buffer.metaDesc.join('\n').trim(),
                    intro: buffer.intro.join('\n').trim(),
                    mainContent: buffer.mainContent.join('\n').trim() || text,
                    conclusion: buffer.conclusion.join('\n').trim()
                };
            }

            function renderMarkdownToHtml(mdText) {
                if (!mdText) return '<p style="color: var(--text-muted);">No content provided.</p>';
                let html = mdText
                    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                    .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                    .replace(/^# (.*$)/gim, '<h3>$1</h3>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');

                return html.split(/\n\n+/).map(p => {
                    if (p.trim().startsWith('<h3>')) return p;
                    return `<p>${p.trim().replace(/\n/g, '<br>')}</p>`;
                }).join('');
            }

            document.querySelectorAll('.sec-copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetEl = document.getElementById(btn.getAttribute('data-target'));
                    if (targetEl) {
                        navigator.clipboard.writeText(targetEl.innerText);
                        showToast('Section copied');
                    }
                });
            });

            copyBtn.addEventListener('click', () => {
                if (currentBlogText) {
                    navigator.clipboard.writeText(currentBlogText);
                    showToast('Entire document copied');
                }
            });

            downloadBtn.addEventListener('click', () => {
                if (!currentBlogText) return;
                const blob = new Blob([currentBlogText], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Draft_${currentTopic.replace(/[^a-zA-Z0-9]/g, '_')}.txt`;
                a.click();
            });

            toggleViewBtn.addEventListener('click', () => {
                isRawView = !isRawView;
                blogFormattedView.style.display = isRawView ? 'none' : 'block';
                rawView.style.display = isRawView ? 'block' : 'none';
                toggleViewBtn.innerHTML = isRawView ? '<i class="fas fa-layer-group"></i> Formatted' : '<i class="fas fa-code"></i> Raw View';
            });

            function saveToHistory(topic, blog) {
                let history = JSON.parse(localStorage.getItem('draft_history') || '[]');
                history = history.filter(item => item.topic !== topic);
                history.unshift({ topic, blog, date: new Date().toLocaleDateString() });
                if (history.length > 10) history.pop();
                localStorage.setItem('draft_history', JSON.stringify(history));
            }

            openHistoryBtn.addEventListener('click', () => {
                const history = JSON.parse(localStorage.getItem('draft_history') || '[]');
                historyItemsContainer.innerHTML = history.length ? '' : '<p style="text-align:center;">No history available.</p>';
                
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `<div><strong>${item.topic}</strong><br><small>${item.date}</small></div><i class="fas fa-chevron-right"></i>`;
                    div.addEventListener('click', () => {
                        currentBlogText = item.blog;
                        currentTopic = item.topic;
                        blogTopicDisplay.textContent = item.topic;
                        rawView.textContent = currentBlogText;
                        renderBlogSections(currentBlogText);
                        blogSection.style.display = 'block';
                        historyModal.style.display = 'none';
                        showToast('Document loaded');
                    });
                    historyItemsContainer.appendChild(div);
                });
                historyModal.style.display = 'flex';
            });

            closeHistoryModal.addEventListener('click', () => historyModal.style.display = 'none');
            window.addEventListener('click', e => { if (e.target === historyModal) historyModal.style.display = 'none'; });

            function showLoading(show) {
                loader.style.display = show ? 'block' : 'none';
                generateBtn.disabled = show;
                generateBtn.textContent = show ? 'Processing...' : 'Generate Content';
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.style.display = 'block';
            }

            function clearError() {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
